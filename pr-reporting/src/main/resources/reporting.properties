# Reporting module: ClickHouse analytics store (read-only application account).
app.reporting.clickhouse.url=jdbc:clickhouse://localhost:8123/analytics
app.reporting.clickhouse.username=reporting_app
app.reporting.clickhouse.password=Report@1234
app.reporting.clickhouse.pool.maxSize=4
# Interactive query limits (ClickHouse also enforces its own profile limits)
app.reporting.query.maxPageSize=500
app.reporting.query.maxGroups=10000
# Reporting metadata (saved reports) in its own PostgreSQL schema "reporting"
app.reporting.meta.url=jdbc:postgresql://localhost:5432/postgres
app.reporting.meta.username=patientreg_app
app.reporting.meta.password=PrApp@1234
app.reporting.meta.pool.maxSize=2

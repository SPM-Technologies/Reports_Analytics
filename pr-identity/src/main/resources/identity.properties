# Identity module. On first start (no users at all) a super administrator is created with this password;
# change it after the first login (Users screen). Local POC value, plain text like db.properties.
identity.bootstrap.username=admin
identity.bootstrap.password=Admin@1234
# wrong passwords in a row before the account is locked, and for how long
identity.login.maxFailures=5
identity.login.lockMinutes=15

# demo hospitals H002/H003 and demo users (password identity.demo.password); for a shared POC only
identity.demo.enabled=false
identity.demo.password=Demo@1234
